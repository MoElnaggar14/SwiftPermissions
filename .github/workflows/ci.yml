name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Swift 6.4, Xcode 27
            runner: xcode-27
            xcode: '27.0'
            swift: '6\.([4-9]|[1-9][0-9])'
          - name: Swift 6.3, Xcode 26.6
            runner: macos-26
            xcode: '26.6'
            swift: '6\.3'
          - name: Swift 6.1, Xcode 16.4 (oldest supported)
            runner: macos-15
            xcode: '16.4'
            swift: '6\.1'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Check the toolchain
        # Fails if the runner image changed and this job no longer tests the Swift it's named after.
        run: |
          swift --version
          swift --version 2>&1 | grep -E "Swift version ${{ matrix.swift }}"
      - name: Build and test
        run: swift test --parallel --enable-code-coverage

  test-ios:
    name: Test (iOS Simulator)
    runs-on: xcode-27
    # A simulator that never connects to xctest otherwise hangs until the runner's limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(ios[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Boot the simulator
        # Booting up front, and waiting until it's ready, avoids "the test runner hung
        # before establishing connection" when the second test bundle launches.
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Test
        # Parallel testing clones the simulator per bundle; one clone failing to connect
        # fails the run, and these suites take seconds anyway.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SwiftPermissions-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  build:
    name: Build (${{ matrix.destination }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=macOS,variant=Mac Catalyst
          - generic/platform=tvOS
          - generic/platform=watchOS
          - generic/platform=visionOS
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftPermissions-Package \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO

  app-extension:
    name: Build as app-extension-safe
    # Widgets and notification extensions compile packages with only extension-safe API.
    # This build fails if Core, UI or a provider uses API like UIApplication.shared.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftPermissions-Package \
            -destination generic/platform=iOS \
            APPLICATION_EXTENSION_API_ONLY=YES \
            CODE_SIGNING_ALLOWED=NO

  example:
    name: Example app (${{ matrix.destination }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS Simulator
          - generic/platform=iOS
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Every registered permission has its usage description
        run: python3 plugin/skills/swiftpermissions/scripts/check_usage_descriptions.py Example
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Example/SwiftPermissionsExample.xcodeproj \
            -scheme SwiftPermissionsExample \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - run: swiftlint lint --reporter github-actions-logging
      - name: Core, UI and the umbrella link no privacy frameworks
        # App Store review asks for the usage description of every permission whose
        # request API is in the binary, so those frameworks live in opt-in products.
        run: |
          FRAMEWORKS='AVFoundation|Photos|Contacts|EventKit|CoreLocation|CoreBluetooth|CoreMotion|Speech|MediaPlayer|Intents|AppTrackingTransparency|LocalAuthentication|HealthKit|AlarmKit|IOKit|Network'
          if grep -rnE "^[[:space:]]*(@preconcurrency[[:space:]]+)?import[[:space:]]+($FRAMEWORKS)\b" \
              Sources/SwiftPermissionsCore Sources/SwiftPermissionsUI Sources/SwiftPermissions; then
            echo "::error::Move this code into its framework product (Sources/SwiftPermissions<Framework>)."
            exit 1
          fi
      - name: Agent skill covers every framework product
        # plugin/skills/swiftpermissions teaches AI agents the product and Info.plist key
        # of each permission; a new product must be added there too.
        run: |
          SKILL=plugin/skills/swiftpermissions
          python3 -m py_compile "$SKILL/scripts/check_usage_descriptions.py"
          for f in $(sed -n '/^let frameworks/,/^]/p' Package.swift | grep -oE '"[A-Za-z]+"' | tr -d '"'); do
            for file in "$SKILL/scripts/check_usage_descriptions.py" "$SKILL/references/permissions.md"; do
              grep -q "SwiftPermissions$f" "$file" || { echo "::error file=$file::SwiftPermissions$f is missing"; exit 1; }
            done
          done
